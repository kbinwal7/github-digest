[project]
name = "github-digest"
version = "2.0.0"
description = "GitHub repository activity digest and RAG issue discovery"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "google-genai>=1.0,<2",
  "qdrant-client>=1.12,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
